# Services du projet GameScope
#   partner-db   : SOURCE - base PostgreSQL du "partenaire" (catalogue Steam Kaggle)
#   spark        : SOURCE - système big data (Spark Thrift Server, compatible Hive)
#   gamescope-db : STOCKAGE - base PostgreSQL du projet (C4)
#   api          : MISE À DISPOSITION - API REST FastAPI (C5)
#   uptime-kuma  : SUPERVISION - disponibilité de l'API et alertes
#
# Démarrage : docker compose up -d --wait

services:
  partner-db:
    image: postgres:17
    container_name: gamescope_partner_db
    environment:
      POSTGRES_DB: steam_partner
      POSTGRES_USER: ${PARTNER_DB_USER}
      POSTGRES_PASSWORD: ${PARTNER_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - partner_data:/var/lib/postgresql/data
      - ./sources/partner_db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARTNER_DB_USER} -d steam_partner"]
      interval: 5s
      retries: 10

  spark:
    image: spark:3.5.7-python3
    container_name: gamescope_spark
    # Thrift Server au premier plan (sinon le conteneur s'arrête aussitôt)
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >
      /opt/spark/sbin/start-thriftserver.sh
      --master local[*]
      --driver-memory 2g
      --hiveconf hive.server2.thrift.port=10000
      --hiveconf hive.server2.authentication=NOSASL
    ports:
      - "10000:10000"   # JDBC / Hive
      - "4040:4040"     # interface web Spark
    volumes:
      - ./data/bigdata:/data/bigdata
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/10000'"]
      interval: 10s
      retries: 30

  gamescope-db:
    image: postgres:17
    container_name: gamescope_db
    environment:
      POSTGRES_DB: gamescope
      POSTGRES_USER: ${GAMESCOPE_DB_USER}
      POSTGRES_PASSWORD: ${GAMESCOPE_DB_PASSWORD}
      GAMESCOPE_API_PASSWORD: ${GAMESCOPE_API_PASSWORD}
      GAMESCOPE_ANALYST_PASSWORD: ${GAMESCOPE_ANALYST_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - gamescope_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GAMESCOPE_DB_USER} -d gamescope"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: gamescope_api
    env_file: .env
    environment:
      # Dans le réseau Docker, la base est joignable par son nom de service
      GAMESCOPE_DB_HOST: gamescope-db
      GAMESCOPE_DB_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      gamescope-db:
        condition: service_healthy
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: gamescope_monitoring
    ports:
      - "3001:3001"
    volumes:
      - monitoring_data:/app/data
    restart: unless-stopped

volumes:
  partner_data:
  monitoring_data:
  gamescope_data:
